<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provador Virtual — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#f8faf9; color:#1a2a22; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.box { width:100%; max-width:380px; text-align:center; }
.logo { font-family:'Playfair Display',serif; font-size:10px; letter-spacing:8px; color:#2d7a5a; text-transform:uppercase; margin-bottom:14px; }
.titulo { font-family:'Playfair Display',serif; font-size:30px; color:#1a2a22; margin-bottom:6px; }
.titulo em { color:#7EC8A4; font-style:italic; }
.sub { font-size:11px; letter-spacing:2px; color:#2d7a5a; text-transform:uppercase; margin-bottom:40px; }
.campo label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#2d7a5a; display:block; margin-bottom:8px; text-align:left; }
.campo input { width:100%; background:#ffffff; border:1px solid rgba(126,200,164,0.5); border-radius:8px; color:#1a2a22; font-family:'Cormorant Garamond',serif; font-size:28px; padding:14px 16px; outline:none; transition:border-color 0.3s; text-align:center; letter-spacing:8px; }
.campo input:focus { border-color:#7EC8A4; }
.btn { width:100%; background:linear-gradient(135deg,#1a5c3a,#7EC8A4,#1a5c3a); border:none; color:#0a0c0f; font-family:'Playfair Display',serif; font-size:12px; letter-spacing:4px; text-transform:uppercase; padding:14px; cursor:pointer; border-radius:2px; font-weight:700; margin-top:14px; transition:opacity 0.3s; }
.btn:hover { opacity:0.85; }
.btn:disabled { opacity:0.4; cursor:default; }
.erro { background:rgba(200,80,80,0.1); border:1px solid rgba(200,80,80,0.3); color:#E88080; font-size:12px; padding:10px 16px; border-radius:2px; margin-top:14px; display:none; line-height:1.5; }
.aviso { background:rgba(255,200,50,0.08); border:1px solid rgba(255,200,50,0.25); color:#E8C97A; font-size:12px; padding:10px 16px; border-radius:2px; margin-top:14px; display:none; line-height:1.6; text-align:left; }
.aviso strong { color:#FFD966; }
.geo-status { font-size:11px; color:#5B9A7A; margin-top:10px; min-height:16px; letter-spacing:1px; }
.tela-escolha { display:none; text-align:center; }
.bem-vindo { font-family:'Playfair Display',serif; font-size:22px; color:#1a2a22; margin-bottom:6px; }
.bem-sub { font-size:11px; color:#2d7a5a; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
.creditos-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(126,200,164,0.1); border:1px solid rgba(126,200,164,0.25); border-radius:20px; padding:5px 14px; font-size:12px; color:#7EC8A4; margin-bottom:30px; }
.creditos-badge.aviso-cred { background:rgba(255,200,50,0.1); border-color:rgba(255,200,50,0.3); color:#E8C97A; }
.creditos-badge.esgotado { background:rgba(200,80,80,0.1); border-color:rgba(200,80,80,0.3); color:#E88080; }
.opcoes { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.opcao { background:#ffffff; border:1px solid rgba(126,200,164,0.3); border-radius:8px; padding:28px 16px; cursor:pointer; transition:all 0.2s; text-decoration:none; color:inherit; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.opcao:hover { border-color:#7EC8A4; background:rgba(126,200,164,0.12); transform:translateY(-2px); }
.opcao .icone { font-size:36px; margin-bottom:10px; }
.opcao .nome { font-family:'Playfair Display',serif; font-size:16px; color:#1a6b3a; margin-bottom:4px; }
.opcao .desc { font-size:11px; color:#555; letter-spacing:1px; }
.btn-sair { background:none; border:1px solid rgba(126,200,164,0.4); color:#2d7a5a; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:8px 20px; cursor:pointer; border-radius:2px; transition:all 0.2s; margin-top:10px; }
.btn-sair:hover { border-color:rgba(200,80,80,0.3); color:#E88080; }
.banner { border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:14px; line-height:1.6; text-align:left; display:none; }
.banner.amarelo { background:rgba(255,200,50,0.08); border:1px solid rgba(255,200,50,0.25); color:#E8C97A; }
.banner.vermelho { background:rgba(200,80,80,0.1); border:1px solid rgba(200,80,80,0.3); color:#E88080; }
.banner.laranja { background:rgba(230,120,30,0.1); border:1px solid rgba(230,120,30,0.3); color:#E89050; }
</style>
</head>
<body>

<!-- TELA LOGIN -->
<div class="box" id="tela-login">
  <div class="logo">Studio Provador</div>
  <div class="titulo">Provador <em>Virtual</em></div>
  <div class="sub">Cabelo · Maquiagem</div>
  <div class="campo">
    <label>Senha de acesso</label>
    <input type="text" id="input-pin" maxlength="4" placeholder="••••"
      oninput="this.value=this.value.replace(/\D/g,'')"
      onkeydown="if(event.key==='Enter')entrar()">
  </div>
  <button class="btn" id="btn-entrar" onclick="entrar()">Entrar</button>
  <div class="geo-status" id="geo-status"></div>
  <div class="erro" id="login-erro"></div>
  <div class="aviso" id="login-aviso"></div>
</div>

<!-- TELA ESCOLHA -->
<div class="box tela-escolha" id="tela-escolha">
  <div class="bem-vindo" id="bem-vindo">Olá!</div>
  <div class="bem-sub" id="bem-sub">Plano Starter</div>

  <!-- Banners de aviso -->
  <div class="banner amarelo" id="banner-dias" role="alert"></div>
  <div class="banner vermelho" id="banner-vencido" role="alert"></div>
  <div class="banner laranja" id="banner-creditos" role="alert"></div>

  <div class="creditos-badge" id="creditos-badge">✨ carregando…</div>

  <div class="opcoes">
    <a class="opcao" id="link-cabelo" href="cabelo.html">
      <div class="icone">✂️</div>
      <div class="nome">Cabelo</div>
      <div class="desc">Simular corte</div>
    </a>
    <a class="opcao" id="link-makeup" href="maquiagem.html">
      <div class="icone">💄</div>
      <div class="nome">Maquiagem</div>
      <div class="desc">Simular make</div>
    </a>
  </div>
  <button class="btn-sair" onclick="sair()">Sair</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const fb = initializeApp({
  apiKey:"AIzaSyCB-4FQpw157I6qKJAuXyXc3QEzqlcI1c0",
  authDomain:"studio-provadores.firebaseapp.com",
  projectId:"studio-provadores",
  storageBucket:"studio-provadores.firebasestorage.app",
  messagingSenderId:"368373390400",
  appId:"1:368373390400:web:2f027e9c17402c327953a5"
});
const db = getFirestore(fb);

const GEO_RAIO_METROS = 150;
const DIAS_AVISO = 5;
const CREDITOS_AVISO = 10;
const CARENCIA_MS = 24 * 60 * 60 * 1000; // 1 dia

function getMesAtual() { const d=new Date(); return `${d.getFullYear()}_${d.getMonth()+1}`; }
function getUsosMes(dados) { return (dados.usos||{})[getMesAtual()]||0; }

function distanciaMetros(lat1,lng1,lat2,lng2) {
  const R=6371000, r=Math.PI/180;
  const a=Math.sin((lat2-lat1)*r/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin((lng2-lng1)*r/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function getPosicaoAtual() {
  return new Promise((res,rej) => {
    if (!navigator.geolocation) { rej(new Error('Geolocalização não suportada neste dispositivo.')); return; }
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(new Error('Permita a localização para acessar o provador.')),
      { enableHighAccuracy:true, timeout:10000 }
    );
  });
}

window.entrar = async () => {
  const pin = document.getElementById('input-pin').value.trim();
  const btn = document.getElementById('btn-entrar');
  const erro = document.getElementById('login-erro');
  const avisoEl = document.getElementById('login-aviso');
  const geoStatus = document.getElementById('geo-status');
  erro.style.display = 'none';
  avisoEl.style.display = 'none';

  if (pin.length !== 4) { erro.textContent='Digite os 4 dígitos da sua senha.'; erro.style.display='block'; return; }

  btn.disabled=true; btn.textContent='Verificando…';

  try {
    // 1. Busca licença pelo PIN
    const q = query(collection(db,'licencas'), where('pin','==',pin), where('compartilhado','==',true));
    const snap = await getDocs(q);
    if (snap.empty) throw new Error('Senha incorreta ou não encontrada.');
    const docSnap = snap.docs[0];
    const dados = docSnap.data();
    const chave = docSnap.id;

    // 2. Verifica vencimento com carência de 1 dia
    const agora = Date.now();
    const vencido = agora > dados.venceEm;
    const dentroCarencia = agora <= (dados.venceEm + CARENCIA_MS);
    if (vencido && !dentroCarencia) throw new Error('Acesso encerrado. Plano vencido em '+dados.venceData+'. Entre em contato para renovar.');

    // 3. Verifica créditos
    const usos = getUsosMes(dados);
    const limiteBase = dados.limite || 50;
    const avulsos = dados.creditosAvulsos || 0;
    const limiteTotal = limiteBase + avulsos;
    if (usos >= limiteTotal) throw new Error('Créditos esgotados este mês. Entre em contato para adicionar créditos avulsos.');

    // 4. Geolocalização
    geoStatus.textContent = '📍 Verificando localização…';
    const posAtual = await getPosicaoAtual();

    if (dados.geoLat && dados.geoLng) {
      // Já tem local cadastrado — verifica distância
      const dist = distanciaMetros(posAtual.lat, posAtual.lng, dados.geoLat, dados.geoLng);
      if (dist > GEO_RAIO_METROS) throw new Error(`Acesso permitido apenas no local cadastrado do salão. Você está a ${Math.round(dist)}m do endereço registrado.`);
    } else {
      // Primeiro acesso — registra localização
      await updateDoc(doc(db,'licencas',chave), {
        geoLat: posAtual.lat,
        geoLng: posAtual.lng,
        primeiroAcesso: agora
      });
    }
    geoStatus.textContent = '';

    // 5. Salva sessão no sessionStorage
    sessionStorage.setItem('compt_chave', chave);
    sessionStorage.setItem('compt_dados', JSON.stringify({...dados, id:chave}));

    // 6. Monta tela de escolha
    mostrarTelaEscolha(dados, chave, usos, limiteTotal, vencido, dentroCarencia);

  } catch(e) {
    geoStatus.textContent = '';
    erro.textContent = e.message || 'Erro ao verificar acesso.';
    erro.style.display = 'block';
    btn.disabled=false; btn.textContent='Entrar';
  }
};

function mostrarTelaEscolha(dados, chave, usos, limiteTotal, vencido, dentroCarencia) {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-escolha').style.display = 'block';

  const planoLabel = dados.plano === 'starter' ? 'Starter · 50 créditos/mês' : 'Pro · 80 créditos/mês';
  document.getElementById('bem-vindo').textContent = dados.nome;
  document.getElementById('bem-sub').textContent = planoLabel;

  // Badge de créditos
  const rest = limiteTotal - usos;
  const badge = document.getElementById('creditos-badge');
  const avulsos = dados.creditosAvulsos || 0;
  badge.textContent = avulsos > 0
    ? `✨ ${usos} / ${dados.limite||50} +${avulsos} avulso · ${rest} restantes`
    : `✨ ${usos} / ${limiteTotal} créditos usados · ${rest} restantes`;
  badge.className = 'creditos-badge' + (rest <= 0 ? ' esgotado' : rest <= CREDITOS_AVISO ? ' aviso-cred' : '');

  // Banners de aviso
  const diasRestantes = Math.ceil((dados.venceEm - Date.now()) / (1000*60*60*24));

  if (vencido && dentroCarencia) {
    const b = document.getElementById('banner-vencido');
    b.innerHTML = '⛔ <strong>Plano vencido!</strong> Acesso será bloqueado em breve. Entre em contato para renovar.';
    b.style.display = 'block';
  } else if (!vencido && diasRestantes <= DIAS_AVISO) {
    const b = document.getElementById('banner-dias');
    b.innerHTML = `⚠️ <strong>Atenção:</strong> Seu plano vence em <strong>${diasRestantes} dia${diasRestantes>1?'s':''}</strong> (${dados.venceData}). Renove para não perder o acesso.`;
    b.style.display = 'block';
  }

  if (rest <= CREDITOS_AVISO && rest > 0) {
    const b = document.getElementById('banner-creditos');
    b.innerHTML = `🔶 <strong>Créditos acabando:</strong> Restam apenas <strong>${rest} créditos</strong> este mês. Entre em contato para adicionar mais.`;
    b.style.display = 'block';
  }

  // Passa chave via URL para os provadores
  document.getElementById('link-cabelo').href = `cabelo.html?chave=${chave}`;
  document.getElementById('link-makeup').href = `maquiagem.html?chave=${chave}`;
}

window.sair = () => {
  sessionStorage.clear();
  document.getElementById('tela-login').style.display = 'flex';
  document.getElementById('tela-escolha').style.display = 'none';
  document.getElementById('input-pin').value = '';
  document.getElementById('btn-entrar').disabled = false;
  document.getElementById('btn-entrar').textContent = 'Entrar';
};

// Auto-login se já tem sessão ativa
const chaveSalva = sessionStorage.getItem('compt_chave');
const dadosSalvos = sessionStorage.getItem('compt_dados');
if (chaveSalva && dadosSalvos) {
  try {
    const dados = JSON.parse(dadosSalvos);
    const usos = getUsosMes(dados);
    const limiteTotal = (dados.limite||50) + (dados.creditosAvulsos||0);
    const vencido = Date.now() > dados.venceEm;
    const dentroCarencia = Date.now() <= (dados.venceEm + CARENCIA_MS);
    if (!vencido || dentroCarencia) {
      mostrarTelaEscolha(dados, chaveSalva, usos, limiteTotal, vencido, dentroCarencia);
    }
  } catch(_) {}
}
</script>
</body>
</html>
